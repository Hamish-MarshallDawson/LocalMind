<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F4EDEA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F2031" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="LocalMind, reachable any time: wakes the PC when you send a message.">
  <title>LocalMind</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chats and PC status">
      <div class="brand">
        <span class="mark" aria-hidden="true">LM</span>
        <span class="brand-name">LocalMind</span>
        <button class="icon-btn close-drawer" id="close-drawer" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button class="new-chat" id="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat
      </button>
      <nav class="chats" id="chats" aria-label="Chats"></nav>
      <section class="pc-card" id="pc-card" aria-label="PC status"></section>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menu" aria-label="Open chats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="title" id="title">New chat</h1>
        <button class="icon-btn" id="delete-chat" aria-label="Delete this chat" title="Delete this chat" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
        </button>
        <button class="pc-pill" id="pc-pill" aria-haspopup="dialog" aria-controls="pc-sheet">
          <span class="dot" aria-hidden="true"></span><span class="label" id="pc-pill-label">Checking…</span>
        </button>
      </header>

      <div class="ctx" id="ctx" hidden>
        <div class="ctx-meter" aria-hidden="true"><i id="ctx-fill"></i></div>
        <span id="ctx-text"></span>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="requests" id="requests" hidden></div>

      <div class="scroller" id="scroller">
        <div class="messages" id="messages" aria-live="polite"></div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-card">
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Message LocalMind…" enterkeyhint="send"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="options" role="group" aria-label="Message options">
          <label class="select"><span class="sr-only">Model</span><select id="model"></select></label>
          <label class="select" id="kv-wrap"><span class="sr-only">KV cache</span><select id="kv"></select></label>
          <label class="select" id="scope-wrap"><span class="sr-only">Knowledge scope</span><select id="scope" title="Which knowledge-base sections this chat can search"></select></label>
          <button type="button" class="chip" data-opt="web" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>Web
          </button>
          <button type="button" class="chip" data-opt="kb" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>Knowledge
          </button>
          <button type="button" class="chip" id="open-batch" title="Queue several tasks, each in its own chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3 6h2M3 12h2M3 18h2"/></svg>Queue tasks
          </button>
          <button type="button" class="chip" data-opt="thinking" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>Thinking
          </button>
        </div>
        <p class="hint" id="hint"></p>
      </form>
    </main>
  </div>

  <dialog class="sheet" id="pc-sheet" aria-labelledby="pc-sheet-title">
    <div class="sheet-body">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="pc-sheet-content"></div>
      <form method="dialog"><button class="btn ghost wide">Close</button></form>
    </div>
  </dialog>

  <dialog class="sheet" id="batch-sheet" aria-labelledby="batch-title">
    <form class="sheet-body batch-form" id="batch-form">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 id="batch-title" class="sheet-title">Queue tasks</h2>
      <p class="pc-sub">Each item becomes its own new chat with a clean context, and they run one after another,
        using the model, knowledge section and options below the message box.</p>
      <label class="field">Name<input id="batch-name" placeholder="Graduate applications" maxlength="40"></label>
      <label class="field">Instructions for every task
        <textarea id="batch-instructions" rows="4" placeholder="Tailor my LaTeX CV to the job below (open_document the original), British English, save as cv-&lt;company&gt;.tex and compile it."></textarea></label>
      <label class="field">Items, separated by a line of ---
        <textarea id="batch-items" rows="7" placeholder="Barclays, Graduate Analyst&#10;(job description)&#10;---&#10;BlackRock, Associate&#10;(job description)"></textarea></label>
      <p class="hint" id="batch-count"></p>
      <div class="pc-actions">
        <button type="submit" class="btn primary" id="batch-submit" disabled>Queue</button>
        <button type="button" class="btn ghost" id="batch-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <template id="empty-state">
    <div class="empty">
      <div class="mark big" aria-hidden="true">LM</div>
      <h2>What are we working on?</h2>
      <p class="empty-sub"></p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
